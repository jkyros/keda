# Alternative Kerberos Secret using Keytab Authentication
# This is the RECOMMENDED approach for production environments
#
# To use this secret:
# 1. Generate a keytab for your service principal
# 2. Base64-encode the keytab: base64 < your.keytab
# 3. Replace <BASE64_ENCODED_KEYTAB> below with the encoded content
# 4. Apply this secret instead of 03-kerberos-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: kafka-kerberos-credentials
  namespace: kafka-kerberos-demo
type: Opaque
stringData:
  sasl: "gssapi"
  username: "keytabuser"  # Principal name without realm
  realm: "KEDA.LOCAL"
  kerberosServiceName: "kafka"
  # Replace <BASE64_ENCODED_KEYTAB> with your actual base64-encoded keytab
  # Example: Get keytab from KDC and encode it:
  #   kubectl exec -n kafka-kerberos-demo deployment/kdc -- cat /keytabs/keytabuser.keytab | base64 -w0
  keytab: |
    <BASE64_ENCODED_KEYTAB>
  kerberosConfig: |
    [libdefaults]
        default_realm = KEDA.LOCAL
        dns_lookup_realm = false
        dns_lookup_kdc = false
        ticket_lifetime = 24h
        renew_lifetime = 7d
        forwardable = true

    [realms]
        KEDA.LOCAL = {
            kdc = kdc.kafka-kerberos-demo.svc.cluster.local:88
            admin_server = kdc.kafka-kerberos-demo.svc.cluster.local:749
        }

    [domain_realm]
        .kafka-kerberos-demo.svc.cluster.local = KEDA.LOCAL
        kafka-kerberos-demo.svc.cluster.local = KEDA.LOCAL

---
# TriggerAuthentication for Keytab-based auth
# Use this with the keytab secret above
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-kerberos-auth-keytab
  namespace: kafka-kerberos-demo
spec:
  secretTargetRef:
    - parameter: sasl
      name: kafka-kerberos-credentials
      key: sasl
    - parameter: username
      name: kafka-kerberos-credentials
      key: username
    - parameter: keytab
      name: kafka-kerberos-credentials
      key: keytab
    - parameter: realm
      name: kafka-kerberos-credentials
      key: realm
    - parameter: kerberosConfig
      name: kafka-kerberos-credentials
      key: kerberosConfig
    - parameter: kerberosServiceName
      name: kafka-kerberos-credentials
      key: kerberosServiceName
